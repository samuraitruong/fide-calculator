name: Supabase Keepalive

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright and Run script
        run: |
          # Create an isolated directory so npm doesn't conflict with pnpm workspaces
          mkdir -p playwright-runner
          cd playwright-runner
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
          
          # Run the script from the root
          node ../.github/scripts/keepalive.js
